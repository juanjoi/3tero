# Production: the app only. PostgreSQL is the existing server on the host
# (set NUXT_DATABASE_URL in .env). Put it behind your reverse proxy.
services:
  layra:
    image: layra:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NUXT_DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"
