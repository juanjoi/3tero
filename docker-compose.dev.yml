# Local development: PostgreSQL only. The app runs with `npm run dev`.
services:
  db:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trestero
      POSTGRES_PASSWORD: trestero
      POSTGRES_DB: trestero
    ports:
      - "5432:5432"
    volumes:
      - trestero-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trestero -d trestero"]
      interval: 5s
      retries: 10

volumes:
  trestero-pg:
