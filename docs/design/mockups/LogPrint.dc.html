      <a href="Detail.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; background: #F0F3F1; display: flex; align-items: center; justify-content: center">

    <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px">
      <legend style="font-size: 12px; font-weight: 600; color: #56635B; padding: 0; margin-bottom: 6px">Resultado</legend>

        <label for="g2" style="flex: 1; font-size: 14px">PLA Basic · Naranja</label>
        <input id="g2" value="8" style="width: 48px; border: 0; text-align: right; font-size: 15px; font-weight: 600; outline: 0">
        <span style="font-size: 13px; color: #56635B">g</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; height: 72px; border-radius: 14px; border: 1.5px dashed #B9C3BD; background: #FAFBFA; color: #334155; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">

        <input value="3h 14m" style="border: 0; outline: 0; font-size: 17px; font-weight: 600; padding: 0">
      </label>
    </div>

    <label style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #F3FBF5">
      <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #15803D">
      <span style="font-size: 13px; line-height: 1.35; color: #14532D">Marcar el proyecto como <b>Impreso</b> y <b>v3</b> como versión final</span>
    </label>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 12px">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 11px; color: #56635B; font-weight: 500">Coste</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">1,94 €</span>
      </div>
      <button type="submit" style="flex: 1; height: 52px; border-radius: 16px; border: 0; background: #15803D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Guardar</button>
    </div>
