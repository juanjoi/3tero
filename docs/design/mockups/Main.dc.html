<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Layra · Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#15803D}a:hover{color:#166534}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F5; font-family: Inter, system-ui, sans-serif; color: #0F1712; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 14px; background: #F5F7F5">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 34px; height: 34px; border-radius: 10px; background: #15803D; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
        </div>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.5px">Layra</span>
      </div>
      <button aria-label="Cambiar vista" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E6E2; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F1712" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      </button>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E1E6E2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56635B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar proyectos</span>
      <input type="search" placeholder="Buscar proyectos, etiquetas…" style="flex: 1; border: 0; outline: 0; font-size: 15px; font-family: inherit; background: transparent; color: #0F1712">
      <span style="font-size: 12px; font-weight: 600; color: #15803D; background: #DDF4E4; padding: 4px 8px; border-radius: 8px">Filtros</span>
    </label>

    <div style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}} <span style="opacity: 0.7; font-weight: 500">{{c.count}}</span></button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 16px 120px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 4px 0 12px">
      <h2 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 600">{{heading}}</h2>
      <span style="font-size: 13px; color: #56635B">Prioridad ↓</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
        <a href="Detail.dc.html" style="text-decoration: none; color: inherit; background: #FFFFFF; border-radius: 18px; border: 1px solid #E8ECE9; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(15,23,18,0.04), 0 6px 16px rgba(15,23,18,0.05)">
          <div style="height: 132px; position: relative; display: flex; align-items: center; justify-content: center; background: {{p.tint}}">
            <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="{{p.ink}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 3.5 7v10L12 21.5 20.5 17V7z"></path><path d="M3.5 7 12 11.5 20.5 7"></path><path d="M12 11.5v10"></path></svg>
            <span style="position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,0.92); color: {{p.statusColor}}">{{p.statusLabel}}</span>
            <span title="{{p.prioLabel}}" style="position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #FFFFFF; background: {{p.prioColor}}"></span>
          </div>
          <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 14px; font-weight: 600; line-height: 1.25">{{p.title}}</span>
            <span style="font-size: 12px; color: #56635B">{{p.tags}}</span>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 2px">
              <div style="display: flex">
                <sc-for list="{{p.swatches}}" as="s" hint-placeholder-count="2">
                  <span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #FFFFFF; margin-right: -4px; box-shadow: 0 0 0 1px #D5DBD7; background: {{s.hex}}"></span>
                </sc-for>
              </div>
              <span style="font-size: 12px; font-weight: 600; color: #0F1712">{{p.cost}}</span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </main>

  <button aria-label="Nuevo proyecto" style="position: absolute; right: 18px; bottom: 96px; width: 58px; height: 58px; border-radius: 18px; border: 0; background: #15803D; box-shadow: 0 10px 24px rgba(21,128,61,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
  </button>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: rgba(255,255,255,0.94); border-top: 1px solid #E1E6E2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 10px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #15803D; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 3.5 7v10L12 21.5 20.5 17V7z"></path><path d="M3.5 7 12 11.5 20.5 7"></path></svg>
      Proyectos
    </a>
    <a href="Kanban.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56635B; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"></rect><rect x="10" y="4" width="5" height="10" rx="1.5"></rect><rect x="17" y="4" width="4" height="13" rx="1.5"></rect></svg>
      Tablero
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56635B; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3"></circle></svg>
      Materiales
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56635B; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"></path><path d="M18 6h2"></path><circle cx="16" cy="6" r="2"></circle><path d="M4 18h4"></path><path d="M12 18h8"></path><circle cx="10" cy="18" r="2"></circle><path d="M4 12h2"></path><path d="M10 12h10"></path><circle cx="8" cy="12" r="2"></circle></svg>
      Ajustes
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const S = {
      modeling: { label: 'Modelado', color: '#1D4ED8' },
      sliced: { label: 'Laminado', color: '#6D28D9' },
      printed: { label: 'Impreso', color: '#15803D' }
    };
    const P = {
      high: { label: 'Prioridad alta', color: '#EA580C' },
      medium: { label: 'Prioridad media', color: '#EAB308' },
      low: { label: 'Prioridad baja', color: '#94A3B8' }
    };
    const all = [
      { title: 'Organizador Gridfinity 3×2', status: 'sliced', prio: 'high', tags: 'taller · organización', cost: '1,92 €', tint: '#E4F1FF', ink: '#1D4ED8', swatches: ['#1F2937', '#F97316'] },
      { title: 'Soporte auriculares', status: 'printed', prio: 'medium', tags: 'escritorio', cost: '0,84 €', tint: '#DDF4E4', ink: '#15803D', swatches: ['#F5F5F4'] },
      { title: 'Caja Raspberry Pi 5', status: 'modeling', prio: 'high', tags: 'electrónica · homelab', cost: '—', tint: '#EFE7FF', ink: '#6D28D9', swatches: ['#111827'] },
      { title: 'Maceta autorriego', status: 'sliced', prio: 'medium', tags: 'casa · regalos', cost: '2,40 €', tint: '#FFF1DB', ink: '#B45309', swatches: ['#84CC16', '#FAFAF9'] },
      { title: 'Dragón articulado', status: 'printed', prio: 'low', tags: 'juguetes · niños', cost: '3,15 €', tint: '#FFE4E1', ink: '#BE123C', swatches: ['#DC2626', '#FACC15', '#1F2937'] },
      { title: 'Clip cable escritorio', status: 'modeling', prio: 'low', tags: 'escritorio', cost: '—', tint: '#E9EEF0', ink: '#334155', swatches: ['#64748B'] }
    ];
    const f = this.state.filter;
    const list = all.filter((p) => f === 'all' || p.status === f);
    const chipDefs = [
      { id: 'all', label: 'Todos' },
      { id: 'modeling', label: 'Modelado' },
      { id: 'sliced', label: 'Laminado' },
      { id: 'printed', label: 'Impreso' }
    ];
    const chips = chipDefs.map((c) => {
      const on = c.id === f;
      return {
        label: c.label,
        count: String(c.id === 'all' ? all.length : all.filter((p) => p.status === c.id).length),
        style: 'flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; ' + (on ? 'background: #0F1712; color: #FFFFFF; border: 1px solid #0F1712' : 'background: #FFFFFF; color: #0F1712; border: 1px solid #E1E6E2'),
        pick: () => this.setState({ filter: c.id })
      };
    });
    return {
      chips,
      heading: f === 'all' ? 'Todos los proyectos' : chipDefs.find((c) => c.id === f).label,
      projects: list.map((p) => ({
        ...p,
        statusLabel: S[p.status].label,
        statusColor: S[p.status].color,
        prioColor: P[p.prio].color,
        prioLabel: P[p.prio].label,
        swatches: p.swatches.map((hex) => ({ hex }))
      }))
    };
  }
}
</script>
</body>
</html>
