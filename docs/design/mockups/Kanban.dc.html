<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Layra · Tablero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#15803D}a:hover{color:#166534}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: #F5F7F5; font-family: Inter, system-ui, sans-serif; color: #0F1712; display: flex">

  <nav style="width: 220px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E1E6E2; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 18px">
      <div style="width: 34px; height: 34px; border-radius: 10px; background: #15803D; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
      </div>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">Layra</span>
    </div>
    <a href="Main.dc.html" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #334155; font-size: 14px; font-weight: 500">Proyectos</a>
    <a href="Kanban.dc.html" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #14532D; background: #DDF4E4; font-size: 14px; font-weight: 600">Tablero</a>
    <a href="#" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #334155; font-size: 14px; font-weight: 500">Materiales</a>
    <a href="#" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #334155; font-size: 14px; font-weight: 500">Ajustes</a>
    <div style="margin-top: 18px; padding: 0 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #56635B">ETIQUETAS</div>
    <a href="#" style="height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #334155; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2563EB"></span>taller</a>
    <a href="#" style="height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #334155; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #EA580C"></span>regalos</a>
    <a href="#" style="height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #334155; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7C3AED"></span>electrónica</a>
    <a href="#" style="height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #334155; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #DB2777"></span>niños</a>
    <div style="margin-top: auto; padding: 12px; border-radius: 14px; background: #F5F7F5; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; color: #56635B">Almacenamiento</span>
      <div style="height: 6px; border-radius: 3px; background: #E1E6E2"><div style="width: 18%; height: 6px; border-radius: 3px; background: #15803D"></div></div>
      <span style="font-size: 12px; color: #56635B">1,8 GB de 10 GB</span>
    </div>
  </nav>

  <div style="flex: 1; min-width: 0; padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 26px; font-weight: 700; flex: 1">Tablero</h1>
      <label style="display: flex; align-items: center; gap: 8px; height: 44px; width: 300px; padding: 0 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E1E6E2; box-sizing: border-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56635B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="search" aria-label="Buscar" placeholder="Buscar…" style="flex: 1; border: 0; outline: 0; font-size: 14px; background: transparent">
      </label>
      <a href="Import.dc.html" style="height: 44px; padding: 0 16px; border-radius: 12px; background: #15803D; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">+ Nuevo</a>
    </div>

    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{columns}}" as="col" hint-placeholder-count="3">
        <section style="background: #EEF2EF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: {{col.color}}"></span>
            <h2 style="margin: 0; font-size: 15px; font-weight: 700; flex: 1">{{col.title}}</h2>
            <span style="font-size: 12px; font-weight: 600; color: #56635B; background: #FFFFFF; padding: 2px 8px; border-radius: 999px">{{col.count}}</span>
          </div>
          <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
            <a href="Detail.dc.html" style="{{c.style}}">
              <div style="width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0; background: {{c.tint}}"></div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 14px; font-weight: 600; line-height: 1.25">{{c.title}}</span>
                <span style="font-size: 12px; color: #56635B">{{c.tags}}</span>
                <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #334155">
                  <span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.prio}}"></span>
                  <span>{{c.meta}}</span>
                </div>
              </div>
            </a>
          </sc-for>
          <sc-if value="{{col.drop}}" hint-placeholder-val="{{ false }}">
            <div style="height: 64px; border-radius: 16px; border: 2px dashed #15803D; background: rgba(21,128,61,0.06); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #15803D">Soltar aquí → Impreso</div>
          </sc-if>
        </section>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'text-decoration: none; color: inherit; background: #FFFFFF; border-radius: 16px; padding: 10px; display: flex; gap: 12px; ';
    const card = (title, tags, prio, meta, tint, lifted) => ({
      title, tags, prio, meta, tint,
      style: base + (lifted ? 'transform: rotate(-2deg) scale(1.03); box-shadow: 0 18px 40px rgba(15,23,18,0.18); border: 1.5px solid #15803D' : 'box-shadow: 0 1px 2px rgba(15,23,18,0.05); border: 1px solid #E8ECE9')
    });
    return {
      columns: [
        { title: 'Modelado', color: '#1D4ED8', count: '2', drop: false, cards: [
          card('Caja Raspberry Pi 5', 'electrónica', '#EA580C', 'Sin fichero laminado', '#EFE7FF', false),
          card('Clip cable escritorio', 'escritorio', '#94A3B8', 'v1 · STL', '#E9EEF0', false)
        ] },
        { title: 'Laminado', color: '#6D28D9', count: '2', drop: false, cards: [
          card('Organizador Gridfinity 3×2', 'taller', '#EA580C', '96 g · 1,92 €', '#E4F1FF', true),
          card('Maceta autorriego', 'casa · regalos', '#EAB308', '120 g · 2,40 €', '#FFF1DB', false)
        ] },
        { title: 'Impreso', color: '#15803D', count: '2', drop: true, cards: [
          card('Soporte auriculares', 'escritorio', '#EAB308', '1 impresión · 0,84 €', '#DDF4E4', false),
          card('Dragón articulado', 'niños', '#94A3B8', '2 impresiones · 6,30 €', '#FFE4E1', false)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
